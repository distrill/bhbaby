<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP</title>
<style>
  /* The page around this iframe supplies the "please RSVP / BY SEPTEMBER 1ST"
     heading and the floral art, so this document is fields only. Sized to sit
     inside the 336x605 slot without scrolling. */
  @font-face { font-family: 'Cinzel'; src: url('_assets/fonts/bcf845bc9976372da10183c67cc300c0.woff') format('woff'); font-display: swap; }

  :root {
    --terracotta: #cb7d44;
    --button:     #eda571;
    --chip:       #e6e6e6;
    --chip-on:    #f6ede4;
    --ink:        #4b4b4b;
    --rule:       #d2c3ba;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    color: var(--ink);
    font-family: 'Cinzel', Georgia, serif;
  }

  body {
    overflow-y: auto;
    padding: 4px 4px 8px;
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  fieldset { border: 0; margin: 0 0 14px; padding: 0; }
  legend, .q { padding: 0; margin: 0 0 7px; font-size: 12.5px; letter-spacing: .02em; }

  input[type="text"], input[type="number"], textarea {
    width: 100%;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 8px 11px;
  }
  textarea { resize: vertical; min-height: 50px; }
  input:focus, textarea:focus { outline: 2px solid var(--terracotta); outline-offset: 1px; }

  .chips { display: flex; flex-direction: column; gap: 6px; }
  .chip { position: relative; }
  .chip input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .chip span {
    display: block;
    background: var(--chip);
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 9px 13px;
    font-size: 12.5px;
    transition: background .12s, border-color .12s;
  }
  .chip input:hover + span { background: #dedede; }
  .chip input:checked + span { background: var(--chip-on); border-color: var(--terracotta); }
  .chip input:focus-visible + span { outline: 2px solid var(--terracotta); outline-offset: 1px; }

  button {
    width: 100%;
    font: inherit;
    font-size: 15px;
    letter-spacing: .06em;
    color: #fff;
    background: var(--button);
    border: 0;
    border-radius: 999px;
    padding: 11px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--terracotta); }
  button:disabled { opacity: .6; cursor: default; }

  .error { color: #b23c17; font-size: 11.5px; margin: 8px 0 0; text-align: center; }
  [hidden] { display: none !important; }

  /* Off-screen rather than display:none so bots still fill it. */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  #done { text-align: center; padding: 40px 8px; color: var(--terracotta); font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>

<form id="form" novalidate>
  <fieldset>
    <label class="q" for="name">Your full name</label>
    <input type="text" id="name" name="name" autocomplete="name" required>
  </fieldset>

  <fieldset>
    <legend>Will you join us to celebrate the Baby Shower for Miriam and Brent?</legend>
    <div class="chips">
      <label class="chip">
        <input type="radio" name="attending" value="Yes" required>
        <span>Yes, we can't wait to join the fun!</span>
      </label>
      <label class="chip">
        <input type="radio" name="attending" value="No">
        <span>Unfortunately, we can't make it.</span>
      </label>
    </div>
  </fieldset>

  <fieldset id="countQ">
    <legend>How many people (including children) will join the Baby Shower?</legend>
    <div class="chips">
      <label class="chip"><input type="radio" name="headcount" value="1"><span>1</span></label>
      <label class="chip"><input type="radio" name="headcount" value="2"><span>2</span></label>
      <label class="chip"><input type="radio" name="headcount" value="Other"><span>Other</span></label>
    </div>
    <input type="number" id="countOther" min="1" max="99" placeholder="How many?" hidden style="margin-top:6px">
  </fieldset>

  <fieldset>
    <label class="q" for="notes">Anything you'd like us to know to better accommodate you?</label>
    <textarea id="notes" name="notes"></textarea>
  </fieldset>

  <div class="hp" aria-hidden="true">
    <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  </div>

  <button type="submit" id="submit">Submit</button>
  <p class="error" id="error" hidden></p>
</form>

<div id="done" hidden></div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzNfk_WtAl5qJoLnNN9aj4QVbw_6zXkUjPbA6ql5xVlORKJed7SjPoTHH6n4HfyJxD_Tw/exec';
const SECRET   = 'sealions_go_AH_AH_AH_AH_AH_AH_AH';

const form = document.getElementById('form');
const countQ = document.getElementById('countQ');
const countOther = document.getElementById('countOther');
const errorEl = document.getElementById('error');
const submitBtn = document.getElementById('submit');

const attending = () => form.querySelector('input[name="attending"]:checked')?.value || '';
const headcount = () => form.querySelector('input[name="headcount"]:checked')?.value || '';

// Headcount is only meaningful for a yes.
form.addEventListener('change', e => {
  if (e.target.name === 'attending') countQ.hidden = attending() === 'No';
  if (e.target.name === 'headcount') {
    countOther.hidden = headcount() !== 'Other';
    if (!countOther.hidden) countOther.focus();
  }
});

function fail(msg) {
  errorEl.textContent = msg;
  errorEl.hidden = false;
  submitBtn.disabled = false;
  submitBtn.textContent = 'Submit';
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  errorEl.hidden = true;

  const name = form.name.value.trim();
  if (!name) return fail('Please add your name.');
  if (!attending()) return fail('Please let us know if you can make it.');

  let count = '';
  if (attending() === 'Yes') {
    if (!headcount()) return fail('Please tell us how many are coming.');
    count = headcount() === 'Other' ? countOther.value.trim() : headcount();
    if (!count) return fail('Please tell us how many are coming.');
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending…';

  const payload = {
    secret: SECRET,
    name,
    attending: attending(),
    headcount: count,
    notes: document.getElementById('notes').value.trim(),
    website: form.website.value
  };

  try {
    // No headers object: the body goes as text/plain, which avoids a CORS
    // preflight. Apps Script has no doOptions and 405s on OPTIONS.
    const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'unknown error');

    document.getElementById('done').textContent = payload.attending === 'Yes'
      ? "You're on the list. We can't wait to see you."
      : "Thank you for letting us know — you'll be missed.";
    form.hidden = true;
    document.getElementById('done').hidden = false;
  } catch (err) {
    fail("Sorry — that didn't send. Please try again, or text us your RSVP.");
  }
});
</script>
</body>
</html>
